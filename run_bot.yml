name: Job Search Bot 24/7
on:
  schedule:
    - cron: '*/20 * * * *' # Se ejecuta cada 20 minutos (límite recomendado en GitHub Free)
  workflow_dispatch: # Permite ejecutarlo manualmente desde GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install curl_cffi beautifulsoup4 cloudscraper schedule

      - name: Ejecutar Bot
        run: python bot_cloud.py

      - name: Guardar progreso (IDs de ofertas)
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add ofertas_vistas.txt
          git commit -m "Update seen jobs" || echo "No changes to commit"
          git push
