name: JobPulse Bot - Búsqueda de Empleo

on:
  schedule:
    # Ejecutar cada 30 minutos (recomendado para evitar bloqueos)
    - cron: '*/30 * * * *'
  
  # Permitir ejecución manual desde GitHub
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Permite escribir en el repositorio para actualizar datos
      actions: read
    
    steps:
      - name: 📥 Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar búsqueda
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python job_bot.py

      - name: 💾 Guardar cambios en base de datos
        if: always()
        run: |
          git config --global user.email "bot@jobpulse.local"
          git config --global user.name "JobPulse Bot"
          git add ofertas_vistas.json bot.log || true
          git commit -m "✅ Actualización automática $(date +'%Y-%m-%d %H:%M')" || true
          git push || true

      - name: 📊 Mostrar log
        if: always()
        run: |
          if [ -f bot.log ]; then
            echo "=== ÚLTIMAS 50 LÍNEAS DEL LOG ==="
            tail -50 bot.log
          fi
